<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый пароль — ITSchool</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <header class="site-header">
        <div class="container nav">
            <a class="brand" href="index.html" aria-label="ITSchool — на главную">
                <svg viewBox="0 0 120 140" fill="none" aria-hidden="true">
                    <g stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M60 118V48" />
                        <path d="M60 118 36 138" />
                        <path d="M60 118 84 138" />
                        <path d="M60 104 44 88V74" />
                        <path d="M60 92 78 74V62" />
                        <path d="M60 78 40 58" />
                        <path d="M60 64 82 42" />
                    </g>
                    <g fill="currentColor">
                        <circle cx="44" cy="68" r="6" />
                        <circle cx="78" cy="56" r="6" />
                        <circle cx="35" cy="53" r="6" />
                        <circle cx="87" cy="37" r="6" />
                        <circle cx="60" cy="42" r="6" />
                    </g>
                </svg>
                <span class="brand-text">
                    <span class="brand-name"><span>IT</span>School</span>
                    <span class="brand-sub">ОГЭ • ЕГЭ • ИНФОРМАТИКА</span>
                </span>
            </a>
            <div class="nav-menu">
                <nav class="nav-links">
                    <a href="index.html">Главная</a>
                    <a href="lectures.html">Материалы</a>
                </nav>
                <div class="nav-auth" id="nav-auth"></div>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container" style="max-width:460px;">
                <div class="card">
                    <h2 style="font-size:1.5rem;">Новый пароль</h2>

                    <div id="reset-checking" class="muted">Проверяем ссылку...</div>

                    <div id="reset-invalid" hidden>
                        <p class="muted">Ссылка недействительна или устарела. Запросите новую
                            на странице входа.</p>
                        <a class="btn btn-outline" href="login.html">На страницу входа</a>
                    </div>

                    <form id="reset-form" hidden>
                        <p class="muted" style="font-size:.95rem;">Придумайте новый пароль для входа на сайт.</p>
                        <label class="field">
                            <span>Новый пароль</span>
                            <input type="password" name="password" required minlength="10"
                                autocomplete="new-password">
                            <span class="field-hint">Не короче 10 символов, латинские строчная
                                и заглавная буквы и хотя бы одна цифра.</span>
                        </label>
                        <label class="field">
                            <span>Повторите пароль</span>
                            <input type="password" name="confirm" required minlength="10"
                                autocomplete="new-password">
                        </label>
                        <button class="btn btn-lg" type="submit" id="reset-btn" style="width:100%;">Сохранить пароль</button>
                        <div id="reset-message" class="form-msg"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom" style="border:0;padding-top:0;">
                <span>© <span id="year">2026</span> Ямкина Елена Владимировна • Ульяновск</span>
                <span><a href="index.html">На главную</a></span>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/app.js"></script>
    <script type="module" src="assets/js/reset.js"></script>
</body>

</html>
